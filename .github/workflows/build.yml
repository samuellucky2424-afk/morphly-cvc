name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHLY_BACKEND_PAYLOAD_URL: ${{ secrets.MORPHLY_BACKEND_PAYLOAD_URL }}
          MORPHLY_BACKEND_PAYLOAD_AUTH_HEADER: ${{ secrets.MORPHLY_BACKEND_PAYLOAD_AUTH_HEADER }}
        run: npm run dist:win

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
